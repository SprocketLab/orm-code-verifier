
defaults:
  - base@_here_
  - _self_

problem: |-
  [PROBLEM]
  {{problem}}
  [/PROBLEM]
program: |-
  [SOLUTION]
  ```python
  {{program}}
  ```
  [/SOLUTION]
outcome: "{{outcome}}"
prompt: |-
  {%- if instruction -%}
  {{instruction}}
  {% endif -%}
  {% if icl_examples -%}
  {%- for example in icl_examples -%}
  # Example {{loop.index|string}}:
  {{example +"\n\n"}}
  {%- endfor -%}
  # Example {{icl_examples|length + 1}}:
  {% endif -%}
  {%- if problem -%}
  {{ problem }}
  {% endif -%}
  {{ program }}
  
pass_choice_str: "Yes"
fail_choice_str: "No"
problem_start_delim: "[PROBLEM]"
problem_end_delim: "[/PROBLEM]"